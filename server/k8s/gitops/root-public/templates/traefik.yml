apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: "{{ .Release.Namespace }}"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: traefik
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    repoURL: oci://ghcr.io/traefik/helm/traefik
    targetRevision: sha256:bd20184b7da82f7cbb12ff51aad9529426b879ee622b43e7292ffdfc6071e3a2 # 42.4.0
    path: "."
    helm:
      valuesObject:
        providers:
          kubernetesGateway:
            enabled: true
        service:
          spec:
            externalTrafficPolicy: Local
        gateway:
          listeners:
            web:
              port: 8000
              hostname: "*.jensw.eu"
              protocol: HTTP
              namespacePolicy:
                from: All
            websecure:
              port: 8443
              hostname: "*.jensw.eu"
              protocol: HTTPS
              namespacePolicy:
                from: All
              mode: Terminate
              certificateRefs:
                - name: tls-jensw-eu
            web-host:
              port: 8000
              hostname: "*.fiona-k8s.jensw.eu"
              protocol: HTTP
              namespacePolicy:
                from: All
            websecure-host:
              port: 8443
              hostname: "*.fiona-k8s.jensw.eu"
              protocol: HTTPS
              namespacePolicy:
                from: All
              mode: Terminate
              certificateRefs:
                - name: tls-fiona-k8s-jensw-eu
        api:
          insecure: true
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
