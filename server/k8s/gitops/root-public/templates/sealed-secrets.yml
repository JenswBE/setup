apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: "{{ .Release.Namespace }}"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: sealed-secrets
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts/sealed-secrets
    targetRevision: sha256:3119a2fe909d355389887f90409159d49a939cd7567f5289c29e6629be37057f # 2.22.0
    path: "."
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
