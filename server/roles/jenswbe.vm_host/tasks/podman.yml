- name: Podman - Install packages
  ansible.builtin.package:
    name:
      - podman

- name: Podman - Copy systemd unit files
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "644"
  loop:
    - podman-prune.service
    - podman-prune.timer

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Podman - Enable and start systemd units
  ansible.builtin.systemd_service:
    name: podman-prune.timer
    enabled: true
    state: started
  loop:
    - podman-prune.timer
    - podman

- name: Caddy - Include copy_dir role
  ansible.builtin.include_role:
    name: jenswbe.copy_dir
  vars:
    jwcd_source_templates_dir: roles/jenswbe.vm_host/templates/caddy
    jwcd_destination_dir: /etc/containers/systemd/caddy
    jwcd_privileged: true
    jwcd_destination_delete_extra: true

- name: Caddy - Ensure caddy is started
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: caddy
    state: started
