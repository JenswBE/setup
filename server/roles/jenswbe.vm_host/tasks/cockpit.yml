- name: Cockpit - Install packages without recommends
  ansible.builtin.apt:
    name:
      - cockpit # Recommendation cockpit-networkmanager installs NetworkManager while we use systemd-networkd
    install_recommends: false
    update_cache: true

- name: Cockpit - Install packages with recommends
  ansible.builtin.apt:
    name:
      - cockpit-machines
      - cockpit-pcp
      - cockpit-podman
      - cockpit-storaged
      - podman

- name: Cockpit - Enable and start systemd units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - cockpit.socket
    - podman

- name: Cockpit - Make proxy aware
  ansible.builtin.copy:
    dest: /etc/cockpit/cockpit.conf
    owner: root
    group: root
    mode: "644"
    content: |
      [WebService]
      Origins = https://cockpit.{{ inventory_hostname }}.{{ general_domain_local }} wss://cockpit.{{ inventory_hostname }}.{{ general_domain_local }}
      ProtocolHeader = X-Forwarded-Proto
  notify: Restart cockpit

- name: Ensure cockpit.socket.d override directory exists
  ansible.builtin.file:
    owner: root
    group: root
    mode: "755"
    path: /etc/systemd/system/cockpit.socket.d
    state: directory

- name: Cockpit - Only listen on localhost
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/override.conf
    owner: root
    group: root
    mode: "644"
    content: |
      [Socket]
      # Remove existing port
      ListenStream=
      # Assign new port
      ListenStream=127.0.0.1:9090
  notify: Restart cockpit.socket
